    <main class="max-w-6xl mx-auto px-4 py-8">

        <p id="mensaje-sistema" role="status" aria-live="polite" class="hidden mb-5 rounded-lg px-4 py-3 text-sm"></p>

        <section id="vista-publicar" class="bg-white p-6 rounded-xl shadow-md max-w-2xl mx-auto">
            <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2 flex items-center">
                <i class="fa-solid fa-paper-plane text-sky-600 mr-2"></i> Crear Nueva Solicitud
            </h2>
            <form id="form-solicitud" onsubmit="guardarSolicitud(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre del Solicitante</label>
                    <input type="text" id="nombre" required placeholder="Ej: Mariana Mercado" class="mt-1 block w-full rounded-md border-gray-300 border p-2.5 shadow-sm focus:border-sky-500 focus:ring-sky-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Tipo de Servicio</label>
                        <select id="categoria" required class="mt-1 block w-full rounded-md border-gray-300 border p-2.5 shadow-sm focus:border-sky-500 focus:ring-sky-500">
                            <option value="Trámites y Gestiones">Trámites y Gestiones</option>
                            <option value="Compras por Encargo">Compras por Encargo</option>
                            <option value="Retiro de Documentación">Retiro de Documentación</option>
                            <option value="Encomiendas / Paquetes">Retiro de Encomiendas</option>
                            <option value="Búsqueda de Productos">Búsqueda de Productos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Ofrecimiento Económico ($ ARS)</label>
                        <input type="number" id="remuneracion" required placeholder="Ej: 3500" class="mt-1 block w-full rounded-md border-gray-300 border p-2.5 shadow-sm focus:border-sky-500 focus:ring-sky-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Ubicación / Lugar en Capital</label>
                    <input type="text" id="lugar" required placeholder="Ej: Centro Cívico / Casa de Gobierno / Comercio X" class="mt-1 block w-full rounded-md border-gray-300 border p-2.5 shadow-sm focus:border-sky-500 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Descripción detallada de la gestión</label>
                    <textarea id="descripcion" rows="3" required placeholder="Detallá qué documentación hay que presentar/retirar o qué producto comprar..." class="mt-1 block w-full rounded-md border-gray-300 border p-2.5 shadow-sm focus:border-sky-500 focus:ring-sky-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                    Publicar Solicitud
                </button>
            </form>
        </section>

        <section id="vista-solicitudes" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Solicitudes Disponibles</h2>
                    <p class="text-sm text-gray-600">Postulate a las peticiones publicadas por la comunidad de Valle Fértil.</p>
                </div>
                <span id="contador-pedidos" class="bg-sky-100 text-sky-800 text-xs font-semibold px-2.5 py-1 rounded-full border border-sky-300">0 Pedidos</span>
            </div>

            <div id="contenedor-tarjetas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </section>

    </main>

       aria-label="Consultar por WhatsApp para gestionar un trámite"
       class="fixed bottom-5 right-5 z-50 inline-flex items-center gap-2 rounded-full bg-green-500 px-5 py-3 font-semibold text-white shadow-lg transition hover:bg-green-600 focus:outline-none focus:ring-4 focus:ring-green-300">
        <i class="fa-brands fa-whatsapp text-2xl" aria-hidden="true"></i>
        <span>Gestioná tu trámite</span>
    </a>

    <script>
        const SUPABASE_URL = 'https://zlloirrfhhsllwpjlwot.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Ss5ljM604igdZKelGijLNw_oaatsZ2w';
        const SUPABASE_TABLE_URL = `${SUPABASE_URL}/rest/v1/solicitudes`;
        let solicitudes = [];

        function supabaseConfigurado() {
          return SUPABASE_URL.startsWith('https://')
            && SUPABASE_URL.endsWith('.supabase.co')
            && !SUPABASE_URL.includes('PEGAR_')
            && !SUPABASE_ANON_KEY.includes('PEGAR_');
        }

        function mostrarMensaje(texto, esError = false) {
          const mensaje = document.getElementById('mensaje-sistema');
          mensaje.textContent = texto;
          mensaje.className = `mb-5 rounded-lg px-4 py-3 text-sm ${esError
            ? 'bg-red-100 text-red-800'
            : 'bg-sky-100 text-sky-800'}`;
        }

        async function consultarSupabase(path = '', opciones = {}) {
          if (!supabaseConfigurado()) {
            throw new Error('Falta configurar la URL y la clave pública de Supabase en index.html.');
          }

          const respuesta = await fetch(`${SUPABASE_TABLE_URL}${path}`, {
            ...opciones,
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              ...(opciones.body ? { 'Content-Type': 'application/json' } : {}),
              ...(opciones.headers || {})
            }
          });

          if (!respuesta.ok) {
            const detalle = await respuesta.text();
            throw new Error(`Supabase respondió ${respuesta.status}: ${detalle}`);
          }

          const respuestaTexto = await respuesta.text();
          return respuestaTexto ? JSON.parse(respuestaTexto) : null;
        }

        function escaparHTML(valor) {
          return String(valor ?? '').replace(/[&<>"']/g, (caracter) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          })[caracter]);
        }

        function crearMensajeWhatsApp(solicitud, numeroPedido) {
          return [
            '¡Hola! Me comunico con Valle Fértil Conecta para solicitar un encargo.',
            '',
            `Mi nombre es: ${solicitud.nombre}`,
            `Número de pedido (si ya lo realicé en la web): ${numeroPedido}`,
            `Tipo de encargo: ${solicitud.categoria}`,
            `Descripción: ${solicitud.descripcion}`,
            `Lugar: ${solicitud.lugar}`,
            `Ofrecimiento económico: $${solicitud.remuneracion} ARS`,
            '',
            'Quisiera conocer los pasos para continuar con la gestión. ¡Gracias!'
          ].join('\n');
        }

        function crearEnlaceWhatsApp(texto) {
          return `https://wa.me/5492645066391?text=${encodeURIComponent(texto)}`;
        }

        function cambiarVista(vista) {
          const vistaPublicar = document.getElementById('vista-publicar');
          const vistaSolicitudes = document.getElementById('vista-solicitudes');

          if (vista === 'publicar') {
            vistaPublicar.classList.remove('hidden');
            vistaSolicitudes.classList.add('hidden');
          } else {
            vistaPublicar.classList.add('hidden');
            vistaSolicitudes.classList.remove('hidden');
            renderizarSolicitudes();
          }
        }

        async function guardarSolicitud(e) {
          e.preventDefault();

          try {
            const nuevaSolicitud = {
              id: crypto.randomUUID(),
              nombre: document.getElementById('nombre').value.trim(),
              categoria: document.getElementById('categoria').value,
              remuneracion: Number(document.getElementById('remuneracion').value),
              lugar: document.getElementById('lugar').value.trim(),
              descripcion: document.getElementById('descripcion').value.trim(),
              estado: 'Pendiente',
              fecha: new Date().toLocaleDateString('es-AR')
            };
            nuevaSolicitud.mensaje_whatsapp = crearMensajeWhatsApp(nuevaSolicitud, nuevaSolicitud.id);

            await consultarSupabase('', {
              method: 'POST',
              headers: { Prefer: 'return=minimal' },
              body: JSON.stringify(nuevaSolicitud)
            });

            const enlaceWhatsApp = document.getElementById('enlace-whatsapp');
            enlaceWhatsApp.href = crearEnlaceWhatsApp(nuevaSolicitud.mensaje_whatsapp);
            window.location.assign(enlaceWhatsApp.href);
          } catch (error) {
            mostrarMensaje(`No se pudo publicar el pedido. ${error.message}`, true);
          }
        }

        async function tomarGestion(id) {
          try {
            await consultarSupabase(`?id=eq.${encodeURIComponent(id)}`, {
              method: 'PATCH',
              headers: { Prefer: 'return=minimal' },
              body: JSON.stringify({ estado: 'Aceptado' })
            });
            mostrarMensaje('El pedido fue marcado como aceptado.');
            await cargarSolicitudes();
          } catch (error) {
            mostrarMensaje(`No se pudo aceptar el pedido. ${error.message}`, true);
          }
        }

        async function cancelarGestion(id) {
          const solicitud = solicitudes.find((item) => item.id === id);
          if (!solicitud || solicitud.estado !== 'Aceptado' ||
              !window.confirm('¿Querés cancelar la aceptación? El pedido volverá a estar disponible.')) {
            return;
          }

          try {
            await consultarSupabase(`?id=eq.${encodeURIComponent(id)}`, {
              method: 'PATCH',
              headers: { Prefer: 'return=minimal' },
              body: JSON.stringify({ estado: 'Pendiente' })
            });
            mostrarMensaje('Se canceló la aceptación y el pedido volvió a estar disponible.');
            await cargarSolicitudes();
          } catch (error) {
            mostrarMensaje(`No se pudo cancelar la aceptación. ${error.message}`, true);
          }
        }

        async function eliminarSolicitud(id) {
          const solicitud = solicitudes.find((item) => item.id === id);
          if (!solicitud || !window.confirm('¿Querés eliminar este pedido realizado?')) {
            return;
          }

          try {
            await consultarSupabase(`?id=eq.${encodeURIComponent(id)}`, {
              method: 'DELETE',
              headers: { Prefer: 'return=minimal' }
            });
            mostrarMensaje('El pedido se eliminó para todos.');
            await cargarSolicitudes();
          } catch (error) {
            mostrarMensaje(`No se pudo eliminar el pedido. ${error.message}`, true);
          }
        }

        async function cargarSolicitudes() {
          if (!supabaseConfigurado()) {
            solicitudes = [];
            renderizarSolicitudes();
            mostrarMensaje('Para activar los pedidos compartidos, primero configurá Supabase en index.html y ejecutá supabase.sql.', true);
            return;
          }

          try {
            const pedidos = await consultarSupabase('?select=*&order=created_at.desc');
            solicitudes = pedidos;
            renderizarSolicitudes();
          } catch (error) {
            mostrarMensaje(`No se pudieron cargar los pedidos compartidos. ${error.message}`, true);
          }
        }

        function renderizarSolicitudes() {
          const contenedor = document.getElementById('contenedor-tarjetas');
          const contador = document.getElementById('contador-pedidos');
          contenedor.innerHTML = '';

          if (solicitudes.length === 0) {
            contador.innerText = '0 Pedido(s)';
            contenedor.innerHTML = '<p class="text-gray-500 col-span-3 text-center py-8">No hay solicitudes activas por el momento.</p>';
            return;
          }

          solicitudes.forEach((item) => {
            const esPendiente = item.estado === 'Pendiente';
            const tarjetaHtml = `
              <div class="card bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden flex flex-col justify-between">
                <div class="p-5">
                  <div class="flex justify-between items-start mb-3">
                    <span class="bg-sky-100 text-sky-800 text-xs font-bold px-2 py-1 rounded">${escaparHTML(item.categoria)}</span>
                    <span class="text-xs text-gray-400"><i class="fa-regular fa-clock mr-1"></i>${escaparHTML(item.fecha)}</span>
                  </div>
                  <h3 class="font-bold text-lg text-gray-800 mb-1">${escaparHTML(item.descripcion)}</h3>
                  <p class="text-sm text-gray-600 mb-2"><i class="fa-solid fa-location-dot text-red-500 mr-1"></i> <strong>Lugar:</strong> ${escaparHTML(item.lugar)}</p>
                  <p class="text-sm text-gray-600 mb-4"><i class="fa-solid fa-user text-sky-600 mr-1"></i> <strong>Solicitado por:</strong> ${escaparHTML(item.nombre)}</p>
                </div>
                <div class="bg-gray-50 px-5 py-3 border-t flex justify-between items-center mt-auto">
                  <div>
                    <span class="text-xs text-gray-500 block">Pago propuesto</span>
                    <span class="text-lg font-bold text-sky-700">$${escaparHTML(item.remuneracion)} ARS</span>
                  </div>
                  <div class="flex flex-wrap justify-end items-center gap-2">
                    ${esPendiente ? `
                      <button onclick="tomarGestion('${escaparHTML(item.id)}')" class="bg-sky-600 hover:bg-sky-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition">
                        Tomar Trabajo
                      </button>
                    ` : `
                      <span class="bg-gray-200 text-gray-700 text-xs font-bold px-3 py-1 rounded-full">
                        <i class="fa-solid fa-check mr-1"></i> Aceptado
                      </span>
                      <button onclick="cancelarGestion('${escaparHTML(item.id)}')" aria-label="Cancelar aceptación del pedido" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-sm font-semibold px-3 py-2 rounded-lg transition">
                        <i class="fa-solid fa-xmark mr-1" aria-hidden="true"></i> Cancelar
                      </button>
                    `}
                    <button onclick="eliminarSolicitud('${escaparHTML(item.id)}')" aria-label="Eliminar pedido realizado" class="bg-red-100 hover:bg-red-200 text-red-700 text-sm font-semibold px-3 py-2 rounded-lg transition">
                      <i class="fa-solid fa-trash mr-1" aria-hidden="true"></i> Eliminar
                    </button>
                  </div>
                </div>
              </div>
            `;
            contenedor.insertAdjacentHTML('beforeend', tarjetaHtml);
          });

          contador.innerText = `${contenedor.querySelectorAll('.card').length} Pedido(s)`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
          await cargarSolicitudes();
          window.setInterval(() => {
            if (!document.hidden) {
              cargarSolicitudes();
            }
          }, 30000);
        });

        window.cambiarVista = cambiarVista;
        window.guardarSolicitud = guardarSolicitud;
        window.tomarGestion = tomarGestion;
        window.cancelarGestion = cancelarGestion;
        window.eliminarSolicitud = eliminarSolicitud;
    </script>
</body>
</html>
